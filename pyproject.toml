[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioparity"
version = "0.1.0"
description = "Evidence that a rewrite of a bioinformatics tool matches the original"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["typer>=0.12", "pydantic>=2", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
bioparity = "bioparity.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bioparity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
